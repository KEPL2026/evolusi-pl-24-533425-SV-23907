<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Event - Campus Event Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Register Event</h1>
        <p>Daftarkan dirimu untuk mengikuti event kampus.</p>
    </header>

    <main>
        <section>
            <h2>Form Registrasi</h2>

            <form id="registrationForm">

                <label for="name">Nama Lengkap</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <br><br>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    required
                >

                <br><br>

                <label for="event">Pilih Event</label>
                <select id="event" required>
                    <option value="">-- Pilih Event --</option>
                    <option value="tech-talk">Tech Talk: Introduction to AI</option>
                    <option value="career-expo">Campus Career Expo</option>
                    <option value="hackathon">Student Hackathon</option>
                </select>

                <br><br>

                <button type="submit">Daftar Sekarang</button>
                <p id="successMessage"></p>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Event Hub</p>
    </footer>

    <script>
    const registrationForm = document.getElementById("registrationForm");
    const successMessage = document.getElementById("successMessage");

    registrationForm.addEventListener("submit", function (event) {
        event.preventDefault();

        successMessage.textContent =
            "Registrasi berhasil! Sampai jumpa di event.";

        registrationForm.reset();
    });
</script>

</body>
</html>
